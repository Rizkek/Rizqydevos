services:
  - type: web
    name: devos-api
    runtime: node
    rootDir: apps/api
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false