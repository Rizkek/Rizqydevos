name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholders only: the build and the tests never connect to a real database or service.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
  API_URL: http://localhost:3001

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The root postinstall runs prisma generate, which needs no database.
      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run type-check
      - run: bun run test
      - run: bun run build

      # Known advisories exist (see docs/plans/HANDOFF.md); this step reports them without failing the run.
      - run: bun audit
        continue-on-error: true

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Playwright uses the Chrome that GitHub-hosted Ubuntu runners already have (no browser download).
      - run: bun run --cwd apps/web test:e2e
